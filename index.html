  <h2 id="intro">1) Introduction</h2>
  <p>
    Blockchain is a new way to record, verify, and transfer value on the internet without a central gatekeeper. It powers

  </p>
  <div class="note"><strong>Quick idea:</strong> A blockchain is a shared database that many computers agree on. Once data is written, it’s extremely hard to change.</div>

<section class="card">
  <h2 id="what">2) What is a Blockchain?</h2>
  <h3>2.1 Core Definition</h3>
  <p>
    A blockchain is a <em>distributed ledger</em>: a list of transactions replicated across many independent computers (nodes).
    Transactions are grouped into <strong>blocks</strong>; each block references the previous one via a cryptographic <strong>hash</strong>, creating an
    ordered chain. Security emerges from <strong>consensus</strong>—rules that let nodes agree on a single history even if some are faulty or
    malicious.
  </p>
  <h3>2.2 How it Works (Simplified)</h3>
  <ul>
    <li><strong>Public keys</strong> act like account numbers; <strong>private keys</strong> authorize spending. Don’t share your private key.</li>
    <li>Users broadcast a transaction → nodes validate → miners/validators bundle them into a block → the block is appended.</li>
    <li>Every full node stores/serves the chain, making censorship and single-point failure far less likely.</li>
  </ul>
  <h3>2.3 Consensus Mechanisms</h3>
  <ul>
    <li><strong>Proof of Work (PoW)</strong>: Miners compete with computing power (BTC). Pros: battle-tested security. Cons: energy intensive.</li>
    <li><strong>Proof of Stake (PoS)</strong>: Validators lock coins as collateral (ETH, BNB Chain). Pros: energy efficient, scalable. Cons: new threat models.</li>
  </ul>
  <h3>2.4 Why Immutability Matters</h3>
  <p>
    Because blocks link by hash, changing old data breaks the chain unless you redo massive work and convince the network.
    This makes the ledger <strong>tamper-resistant</strong>, a property traditional databases don’t natively offer without trusted operators.
  </p>
</section>

    dependency on a single company or state and enables systems to be <strong>open, permissionless, and borderless</strong>. Trade-off: fully
    decentralized systems often scale slower than centralized clouds, so real designs use a spectrum from on-chain to off-chain.
  </p>
</section>
